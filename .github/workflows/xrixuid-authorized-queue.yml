name: XRIXUID authorized-source batch benchmark
on:
  pull_request:
    paths:
      - "benchmarks/authorized-batch/**"
      - ".github/workflows/xrixuid-authorized-queue.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test benchmarks/authorized-batch/test.mjs
      - run: node benchmarks/authorized-batch/benchmark.mjs 5000 200
