name: FB Info API checks
on:
  push:
    paths:
      - "fb-info-api/**"
      - ".github/workflows/fb-info-api-ci.yml"
  pull_request:
    paths:
      - "fb-info-api/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fb-info-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Python bytecode validation
        run: python -m compileall -q main.py meta.py ratecontrol.py
