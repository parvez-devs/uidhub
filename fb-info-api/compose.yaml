services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [backend]
networks:
  backend:
volumes:
  caddy_data:
  caddy_config:
